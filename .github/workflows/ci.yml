name: CI

on:
  push:
    branches:
      - main
      - primitives_redesign
      - composition_framework
      - 'feature/**'
      - 'optimisation/**'
  pull_request:

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce absolute-base dependency boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('library.json').read_text())
          dependencies = manifest.get('dependencies', [])
          if dependencies:
              raise SystemExit(f'ESPressio-System must have zero ESPressio dependencies; found: {dependencies!r}')

          cmake = Path('CMakeLists.txt').read_text()
          forbidden = ('REQUIRES', 'PRIV_REQUIRES', 'target_link_libraries')
          found = [token for token in forbidden if token in cmake]
          if found:
              raise SystemExit(f'ESPressio-System must remain an absolute-base library; forbidden CMake dependency directives: {found}')
          PY
      - name: Build and run DeviceIdentifier regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions -Isrc tests/device_identifier_test.cpp -o device_identifier_test
          ./device_identifier_test
      - name: Build and run runtime identity contracts
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions -Isrc tests/runtime_identity_test.cpp -o runtime_identity_test
          ./runtime_identity_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -Isrc tests/runtime_identity_concurrency_test.cpp -o runtime_identity_concurrency_test
          ./runtime_identity_concurrency_test
      - name: Build and run Composition Framework contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-rtti -fno-exceptions -Isrc tests/composition_framework_test.cpp -o composition_framework_test
          ./composition_framework_test
      - name: Verify public header self-containment
        run: |
          set -e
          for header in src/*.hpp; do
            printf '#include "%s"\nint main(){return 0;}\n' "$(basename "$header")" > /tmp/header_test.cpp
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-rtti -fno-exceptions -Isrc /tmp/header_test.cpp -o /tmp/header_test
          done
      - name: Verify Composition Framework negative contracts
        run: |
          set -e
          for source in tests/negative/*.cpp; do
            output="$(basename "${source%.cpp}")"
            if g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-rtti -fno-exceptions -Isrc "$source" -o "$output" >"$output.log" 2>&1; then
              echo "Negative contract unexpectedly compiled: $source"
              cat "$output.log"
              exit 1
            fi
          done
