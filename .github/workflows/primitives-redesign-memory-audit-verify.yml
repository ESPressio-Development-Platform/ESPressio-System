name: Temporary Memory Audit Fanout Verification

on:
  push:
    branches: [primitives_redesign]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all primitives_redesign branches are free of Memory Audit blocks
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            ESPressio-System ESPressio-Task ESPressio-Command ESPressio-ESP32
            ESPressio-Event ESPressio-MeshAdapters ESPressio-NRF24 ESPressio-Primitive
            ESPressio-Radio ESPressio-Security ESPressio-State ESPressio-Timing
            ESPressio-Mesh ESPressio-ESP-Now ESPressio-Logging ESPressio-Observable
            ESPressio-Persistence ESPressio-Serial ESPressio-Serializable ESPressio-Sockets
            ESPressio-Threads ESPressio-Units ESPressio-Web ESPressio-WiFi
          )
          failed=0
          for repo in "${repos[@]}"; do
            echo "=== ${repo} ==="
            git clone --quiet --depth 1 --branch primitives_redesign \
              "https://github.com/ESPressio-Development-Platform/${repo}.git" "${repo}"
            if grep -R -n \
              --include='*.h' --include='*.hh' --include='*.hpp' --include='*.hxx' \
              --include='*.c' --include='*.cc' --include='*.cpp' --include='*.cxx' \
              --include='*.ipp' --include='*.tpp' --include='*.ino' \
              -e '\* ESPressio Memory Audit' \
              -e '\* End ESPressio Memory Audit' \
              "${repo}" --exclude-dir=.git; then
              echo "ERROR: Memory Audit marker remains in ${repo}" >&2
              failed=1
            else
              echo "clean"
            fi
          done
          exit "${failed}"
